repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-committed-env
        name: refuse a committed .env
        entry: .env must never be committed
        language: fail
        files: ^\.env$

      - id: no-ai-attribution
        name: refuse AI attribution in the commit message
        entry: python3 scripts/hooks/no_ai_attribution.py
        language: system
        stages: [commit-msg]

      - id: requirements-present
        name: requirements.txt keeps a web framework and an LLM client
        entry: python3 scripts/hooks/requirements_present.py
        language: system
        files: ^requirements\.txt$
        pass_filenames: false
