[project]
name = "hardy"
version = "0.1.0"
description = "A storefront for durable goods that argues from evidence"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "hypercorn",
    "jinja2",
    "python-multipart",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "bcrypt",
    "itsdangerous",
    "openai",
    "qdrant-client",
    "langgraph",
    "langchain-core",
    "langsmith",
    "apscheduler",
    "aiosmtplib",
    "pydantic-settings",
    "httpx",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "*"
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
hypothesis = "*"
schemathesis = "*"
pre-commit = "*"

[tool.poetry.group.load]
optional = true

[tool.poetry.group.load.dependencies]
locust = "*"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "qdrant_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "unit: pure logic, no database and no network",
    "integration: database, vector store and app wiring, no network",
    "regression: a defect that was fixed and must not return",
    "contract: the served OpenAPI schema matches what the routes actually do",
    "live: needs a real MESH_API_KEY and calls the network",
]
