services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 96m

  app:
    command: ["hypercorn", "src.main:app", "--bind", "0.0.0.0:8000", "--workers", "1"]
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite+aiosqlite:////data/hardy.db
      PUBLIC_BASE_URL: https://hardy.shashidev.me
      HTTPS_ONLY: "true"
      SCHEDULER_ENABLED: "true"
    mem_limit: 512m

  qdrant:
    mem_limit: 320m

  scheduler:
    profiles: ["standalone-scheduler"]

volumes:
  caddy_data:
  caddy_config:
