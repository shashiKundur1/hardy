{% extends "base.html" %}

{% block title %}{{ status }} · Hardy{% endblock %}

{% block main_class %}faultpage{% endblock %}

{% block main %}
<section class="fault container">
  <p class="fault__code" aria-hidden="true">{{ status }}</p>
  <div class="fault__text">
    <h1>{{ headline }}</h1>
    <p class="fault__blurb">{{ explanation }}</p>
    <p class="fault__detail mono">{{ status }} · {{ detail }}</p>
  </div>
  <div class="fault__actions">
    {% for action in actions %}
    <a class="button{{ '' if loop.first else ' button--quiet' }}" href="{{ action.href }}">
      {{ action.label }}
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
